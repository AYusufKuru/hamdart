x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    container_name: hamdart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hamdart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
      POSTGRES_DB: ${POSTGRES_DB:-hamdart}
      TZ: Europe/Istanbul
      PGTZ: Europe/Istanbul
    command:
      - postgres
      - -c
      - shared_buffers=1536MB
      - -c
      - effective_cache_size=4GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - wal_buffers=16MB
      - -c
      - max_connections=50
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - checkpoint_completion_target=0.9
    volumes:
      - hamdart_pgdata:/var/lib/postgresql/data
      - ${BACKUP_HOST_DIR:-/var/lib/hamdart/backups}:/backups
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-hamdart} -d ${POSTGRES_DB:-hamdart}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 6g
    cpus: 2.0
    logging: *default-logging
    networks:
      - hamdart

  app:
    build: .
    container_name: hamdart-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hamdart}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hamdart}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET gerekli (en az 32 karakter)}
      NODE_ENV: production
      TZ: Europe/Istanbul
      BACKUP_DIR: /app/backups
      BACKUP_OFFSITE_DIR: ${BACKUP_OFFSITE_DIR:-}
      SKIP_MIGRATE: ${SKIP_MIGRATE:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
    expose:
      - "3000"
    volumes:
      - ${BACKUP_HOST_DIR:-/var/lib/hamdart/backups}:/app/backups
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s
    mem_limit: 2g
    cpus: 2.0
    labels:
      autoheal: "true"
    logging: *default-logging
    networks:
      - hamdart

  nginx:
    image: nginx:1.27-alpine
    container_name: hamdart-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-_}
      TZ: Europe/Istanbul
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - ./deploy/nginx/http.conf.template:/etc/nginx/http.conf.template:ro
      - ./deploy/nginx/https.conf.template:/etc/nginx/https.conf.template:ro
      - ./deploy/nginx/select-config.sh:/etc/nginx/select-config.sh:ro
      - hamdart_certbot_www:/var/www/certbot
      - hamdart_certbot_conf:/etc/letsencrypt:ro
    command: ["/bin/sh", "/etc/nginx/select-config.sh"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 3
    mem_limit: 256m
    cpus: 0.5
    logging: *default-logging
    networks:
      - hamdart

  certbot:
    image: certbot/certbot:v3.3.0
    container_name: hamdart-certbot
    restart: unless-stopped
    environment:
      TZ: Europe/Istanbul
    volumes:
      - hamdart_certbot_www:/var/www/certbot
      - hamdart_certbot_conf:/etc/letsencrypt
    entrypoint: /bin/sh
    command:
      - -c
      - trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h; done
    logging: *default-logging
    networks:
      - hamdart

  autoheal:
    image: willfarrell/autoheal
    container_name: hamdart-autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 10
      TZ: Europe/Istanbul
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    logging: *default-logging
    networks:
      - hamdart

volumes:
  hamdart_pgdata:
  hamdart_certbot_www:
  hamdart_certbot_conf:

networks:
  hamdart:
